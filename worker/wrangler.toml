# AFTER the Worker is deployed, optionally install Cloudflare's own agent
# tooling (skills + 5 MCP servers) per https://developers.cloudflare.com/agent-setup/prompt.md
#   claude plugin marketplace add cloudflare/skills
#   claude plugin install cloudflare@cloudflare
# Then /reload-plugins. Note this grants OAuth access to the Cloudflare account
# and is an alternative to wrangler, not a replacement for this config.

name = "in-the-vial-subscribe"
main = "subscribe.js"
compatibility_date = "2026-08-05"

# STEP 2 fills these two in (wrangler kv namespace create ...).
# SUBS  = the subscriber list, stored in your own Cloudflare account.
# RATE  = optional abuse control; safe to leave out.
[[kv_namespaces]]
binding = "SUBS"
id = "6c7174d740cc4cb99315a913dec80746"

# ---- optional, add later when you pick a sender -------------------------
# The Worker runs fine without these: addresses are captured in SUBS and can
# be exported whenever you're ready to send.
# [vars]
# PROVIDER_ENDPOINT = "https://api.buttondown.email/v1/subscribers"
# then: npx wrangler secret put PROVIDER_API_KEY

[[routes]]
pattern = "in-the-vial.com/api/subscribe"
zone_name = "in-the-vial.com"
